[mod]
id = "simple_voice_chat"
version = "1.0.13"
priority = 100

[compatibility]
horizon_revision = "6475f62f3c834b7489e1816bf47f47ea5eb2b879"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "simple_voice_chat"
source = "runtime.rs"

[[module]]
id = "voicechat_network"
file = "crates/horizon-client/src/game/remote.rs"
name = "voicechat_network"
source = "network.rs"

[[injection]]
id = "voicechat_payload"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::handle_packet"
helper = "payload.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "&packet" },
]

[[injection]]
id = "world_lifecycle"
kind = "HEAD"
hook = "world_lifecycle"
hook_version = 1
helper = "lifecycle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "&crate::game::native_lifecycle::WorldPhase", value = "&phase" },
]

[[injection]]
id = "net_from_server"
kind = "HEAD"
hook = "net_from_server"
hook_version = 1
helper = "net.rs"
bindings = [
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "command_handle"
kind = "HEAD"
hook = "command"
hook_version = 1
helper = "command_hook.rs"
bindings = [
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "frame"
kind = "HEAD"
hook = "frame"
hook_version = 1
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "native_mods_list"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "native_mod_settings"
kind = "HEAD"
hook = "settings"
hook_version = 1
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "native_mod_settings_click"
kind = "HEAD"
hook = "settings_click"
hook_version = 1
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "native_key"
kind = "HEAD"
hook = "key"
hook_version = 1
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "native_hud"
kind = "HEAD"
hook = "hud"
hook_version = 1
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[crate]]
id = "svc_client"
path = "crates/svc_client"
dependent = "horizon-client"
