name: Prepare Nightly native sources

on:
  push:
    branches:
      - pavohorizonnightly
    paths:
      - ".github/workflows/prepare-native.yml"
      - "tools/prepare_native.py"
      - "mixins/simple-voice-chat/crates/svc_client/vendor/**"
      - "src/svc_client/**"
      - "src/lib.rs"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed-opus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pavohorizonnightly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Embed libopus for the native package
        run: python tools/prepare_native.py
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test SVC protocol, session and Opus build
        run: |
          cp -R src/svc_client /tmp/svc_client
          cargo test --manifest-path /tmp/svc_client/Cargo.toml
      - name: Commit generated source
        run: |
          git fetch origin pavohorizonnightly
          git rebase origin/pavohorizonnightly
          git add -f src/svc_client/opus_sources.rs
          if git diff --cached --quiet; then
            echo "Embedded Opus source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Embed libopus sources for Nightly native package"
          git push origin HEAD:pavohorizonnightly
