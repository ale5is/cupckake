name: Validate Simple Voice Chat Nightly native mod

on:
  push:
    branches:
      - pavohorizonnightly
    paths:
      - ".github/workflows/prepare-native.yml"
      - "compatibility.json"
      - "mixins/simple-voice-chat/**"
      - "tools/package.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pavohorizonnightly
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build and verify the .hnmod package
        run: python tools/package.py
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: 9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0
          path: horizon
      - name: Validate with Horizon's official native-mod checker
        run: cargo run --manifest-path horizon/crates/cargo-horizon-mod/Cargo.toml -- check target/simple_voice_chat-1.0.2.hnmod
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev libvulkan-dev
      - name: Test SVC protocol, audio and Opus runtime
        run: cargo test --manifest-path mixins/simple-voice-chat/crates/svc_client/Cargo.toml
      - name: Compile the Nightly Hooks API crate
        run: cargo check --manifest-path mixins/simple-voice-chat/api/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: simple-voice-chat-hnmod
          path: target/simple_voice_chat-1.0.2.hnmod
          if-no-files-found: error
