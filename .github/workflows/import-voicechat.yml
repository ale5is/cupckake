name: Import Horizon Simple Voice Chat

on:
  push:
    branches:
      - bootstrap-voicechat-copy

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Sparticle62ops/horizon-simple-voice-chat.git upstream
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path(".")
          for path in list(root.iterdir()):
              if path.name != "upstream":
                  shutil.rmtree(path) if path.is_dir() else path.unlink()
          for path in list(root.rglob(".deps")):
              shutil.rmtree(path)
          PY
          cp -a upstream/. .
          rm -rf upstream .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Horizon Simple Voice Chat upstream"
          git branch -M voicechat-import
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin voicechat-import
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
