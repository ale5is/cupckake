name: Package Simple Voice Chat native mod

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "simple-voice-chat-v*"

permissions:
  contents: read

jobs:
  package:
    name: Build and validate .hnmod package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mod sources
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package native mod
        run: python tools/package.py
      - name: Install Horizon native mod validator
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev 4b08a43f1d32c3946f2638850f9d120bc7ff4a26 cargo-horizon-mod
      - name: Validate .hnmod with Horizon
        run: cargo horizon-mod check target/simple-voice-chat-1.0.1.hnmod
      - name: Upload launcher-installable package
        uses: actions/upload-artifact@v4
        with:
          name: simple-voice-chat-hnmod
          path: target/simple-voice-chat-1.0.1.hnmod
          if-no-files-found: error
          retention-days: 30
