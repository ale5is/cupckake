name: Package and publish Simple Voice Chat native mod

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "simple-voice-chat-v*"

permissions:
  contents: write

jobs:
  package:
    name: Build and validate .hnmod package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mod sources
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package native mod
        run: python tools/package.py
      - name: Install Horizon native mod validator
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev 6475f62f3c834b7489e1816bf47f47ea5eb2b879 cargo-horizon-mod
      - name: Validate .hnmod with Horizon
        run: cargo horizon-mod check target/simple_voice_chat-1.0.5.hnmod
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-voice-chat-hnmod
          path: target/simple_voice_chat-1.0.5.hnmod
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for launcher installation
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: simple-voice-chat-v1.0.5
          target_commitish: ${{ github.sha }}
          name: Simple Voice Chat 1.0.5 (Horizon native)
          body: |
            Native Horizon mod package for Minecraft 26.3.

            Install from Horizon Launcher using the GitHub repository/release source. The launcher compiles the native mod locally.
          files: target/simple_voice_chat-1.0.5.hnmod
          fail_on_unmatched_files: true
          make_latest: true
