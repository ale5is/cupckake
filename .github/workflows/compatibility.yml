name: Simple Voice Chat compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-tests:
    name: svc_client tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Install udev development headers
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test client crate
        run: cargo test --workspace
      - name: Commit refreshed lockfile
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Refresh standalone voice client lockfile"
            git fetch origin main
            git rebase origin/main
            git push
          fi

  horizon-integration:
    name: Check mixin against current Horizon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cupckake
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          path: horizon
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          path: horizon-mixins
          fetch-depth: 1
      - name: Install Linux audio headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cupckake -> target
            horizon-mixins -> target
            horizon -> target
      - name: Test standalone voice client
        working-directory: cupckake
        run: cargo test --workspace
      - name: Build horizon-mixins
        run: cargo build --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli
      - name: Remove upstream documentation symlinks
        run: find horizon -type l -delete
      - name: Fetch Horizon workspace dependencies for offline check
        run: cargo fetch --locked --manifest-path horizon/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Stage mod bundle
        run: |
          mkdir -p mods/simple-voice-chat
          cp -a cupckake/mixins/simple-voice-chat/. mods/simple-voice-chat/
      - name: Verify native hook API metadata
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          metadata = json.loads(Path("cupckake/horizon-native.json").read_text())
          source = Path("horizon/crates/horizon-client/src/game/native_hooks.rs").read_text()
          match = re.search(r"pub\(crate\) const NATIVE_HOOKS_API: u32 = (\d+);", source)
          if not match:
              raise SystemExit("NATIVE_HOOKS_API not found")
          available = int(match.group(1))
          required = int(metadata["hooks"])
          if required > available:
              raise SystemExit(f"mod requires hooks API {required}, Horizon provides {available}")
          print(f"Native hook API OK: requires {required}, Horizon provides {available}")
          PY
      - name: Check native mod against Horizon
        run: |
          cargo run --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli -- check \
            --workspace horizon \
            --mods mods \
            --out target/simple-voice-chat-horizon \
            --trust-native-mods \
            --package horizon-client
